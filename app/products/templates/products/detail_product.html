
{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h1>{{ product.name }}</h1>

        <hr>

        <p><strong>ID:</strong> {{ product.id }}</p>
        <p><strong>Опис:</strong> {{ product.content }}</p>
        <p class="fs-4 text-primary">
            <strong>Ціна: ${{ product.price }}</strong>
        </p>

        <a href="{{ url_for('products.product_list') }}"
           class="btn btn-secondary">
            Назад до списку
        </a>
    </div>
</div>
{% endblock %}
