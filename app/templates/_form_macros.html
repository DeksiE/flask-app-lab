
{% macro render_field(field) %}
<div class="mb-3">
    {{ field.label(class="form-label") }}

    {% if field.errors %}
        {{ field(class="form-control is-invalid") }}

        <div class="invalid-feedback">
            {% for error in field.errors %}
                <div>{{ error }}</div>
            {% endfor %}
        </div>
    {% else %}
        {{ field(class="form-control") }}
    {% endif %}
</div>
{% endmacro %}
